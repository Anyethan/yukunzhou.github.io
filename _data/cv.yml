        highlights:
          - Finished main experiments and produced a paper draft on accurate rod-insertion simulation algorithms based on Projective Dynamics, Cosserat rods, Lagrangian constraint-based methods, and thickness-aware rod contact pressure and friction.
          - Worked on the optimization of Vertex Block Descent.
          - Developed and reproduced SDF soft-body contact, DiSect differentiable cutting, FEM, Projective Dynamics cutting with low-rank update methods, and lung puncturing by Warp.
          - Completed human brain 3D reconstruction from MRI images using neural networks.

      - company: Georgia Institute of Technology
        position: Summer Research Intern - Fluid Simulation with Neural and Particle Flow Maps
        location: Atlanta, GA, USA
        start_date: 2024-06
        end_date: 2024-09
        summary: "Advised by Dr [Bo Zhu](https://faculty.cc.gatech.edu/~bozhu/)."
        highlights:
          - Replicated the Neural Flow Map algorithm with Taichi.
          - Developed real-time 3D stable fluid simulation with OpenGL Compute Shader.
          - Accelerated Particle Flow Map using long-range mapping and short-range projection, achieving an 80% speed improvement.

      - company: City University of Hong Kong
        position: Part-Time Research Assistant - HCI Research on Games and Players
        location: Hong Kong
        start_date: 2022-06
        end_date: 2023-09
        summary: "Advised by Dr [Zhicong Lu](https://www.cs.toronto.edu/~luzhc/)."
        highlights:
          - Produced a paper submitted to a top-tier conference as the only first author.
          - Completed an HCI research project on games and ICT4D, with design implications for player well-being and future application scenarios.

      - company: City University of Hong Kong
        position: Part-Time Research Assistant - Hand-Scratching Gesture Recognition Android Application for AR Glasses
        location: Hong Kong
        start_date: 2022-07
        end_date: 2023-05
        summary: Advised by Dr Kening Zhu.
        highlights:
          - Used CNN models to analyze scratching sounds on AR glasses legs in real time.
          - Developed an Android application for recording, real-time recognition, and AR glasses control.

