<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Project media placeholder</title>
  <desc id="desc">A neutral placeholder for future project images and videos.</desc>
  <rect width="1200" height="675" fill="#f7f7f7"/>
  <rect x="36" y="36" width="1128" height="603" rx="18" fill="none" stroke="#b7b7b7" stroke-width="4" stroke-dasharray="18 16"/>
  <g fill="#777" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="318" font-size="44" font-weight="700">Media Placeholder</text>
    <text x="600" y="372" font-size="26">Replace this thumbnail with your project image, GIF, or video poster.</text>
  </g>
</svg>
